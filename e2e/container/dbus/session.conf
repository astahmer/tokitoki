<!-- Minimal session bus config for the headless image.
     nixpkgs ships an intentionally empty /etc/dbus-1/session.conf stub and
     expects the OS module to fill it in; dbus-run-session then refuses to
     start ("needs one or more <listen> elements"). This file is the upstream
     session.conf minus the self-include of /etc/dbus-1/session.conf. -->
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/tmp</listen>
  <auth>EXTERNAL</auth>
  <standard_session_servicedirs/>
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>
</busconfig>
