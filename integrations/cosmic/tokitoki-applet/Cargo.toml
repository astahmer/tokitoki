[package]
name = "tokitoki-cosmic-applet"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Small Tokitoki usage applet for the COSMIC desktop"

[dependencies]
serde_json = "1"
tokio = { version = "1", features = ["rt"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
features = [
  "applet",
  "applet-token",
  "multi-window",
  "tokio",
  "wayland",
  "winit",
]
